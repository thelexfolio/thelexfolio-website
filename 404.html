.lf-in{animation:lf-in .65s cubic-bezier(.2,.7,.2,1) both}
.lf-ribbon{animation:lf-dash 1.9s .35s cubic-bezier(.6,0,.2,1) both}
.lf-hl{animation:lf-wipe .7s 1.6s ease-out both}
}

@keyframes lf-hero{from{translate:0 0}to{translate:0 calc(var(--d,0) * var(--k,1) * 1px)}}
@keyframes lf-herotext{from{translate:0 0;opacity:1}to{translate:0 calc(120px * var(--k,1));opacity:.12}}

@keyframes lf-rise{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}

@keyframes lf-slide-r{from{translate:calc(-24% * var(--k,1)) 0}to{translate:6% 0}}
@keyframes lf-grow{from{scale:1 0}to{scale:1 1}}
@keyframes lf-ring{from{scale:.7;opacity:.3}to{scale:1.2;opacity:1}}
@keyframes lf-boxview{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.lf-hero-layer{animation:lf-hero linear both;animation-timeline:scroll(nearest block);animation-range:0px 1000px}
.lf-hero-text{animation:lf-herotext linear both;animation-timeline:scroll(nearest block);animation-range:0px 900px}
.lf-par{animation:lf-par linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
.lf-rise{animation:lf-rise ease-out both;animation-timeline:view();animation-range:entry 0% entry 75%}
.lf-slide-l{animation:lf-slide-l linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
.lf-slide-r{animation:lf-slide-r linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
.lf-grow{transform-origin:50% 0;animation:lf-grow linear both;animation-timeline:view();animation-range:cover 12% cover 58%}
.lf-ring{animation:lf-ring linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
.lf-boxview{animation:lf-boxview ease-out both;animation-timeline:view();animation-range:entry 60% cover 45%}
}
}

}

}

.lf-glass{position:sticky;top:0;z-index:40}

}

.lf-catcher{display:none}

@media (prefers-reduced-motion: reduce){.lf-sheet{scale:1;filter:none}}

/* Desktop nav: current section */
.lf-navlink{color:#15141C;text-decoration-color:rgba(10,75,245,0)}
.lf-navlink[aria-current="true"]{color:#0A4BF5;text-decoration-color:#0A4BF5}

@media (max-width: 860px){.lf-navlinks{display:none !important}}
@media (min-width: 861px){.lf-menu-only{display:none !important}}
@media (max-width: 560px){.lf-hide-xs{display:none !important}}
}
